# Local development stack (INF-04): PostgreSQL, the backend and the frontend.
#
#   docker compose up --build          # http://localhost:3000 (demo@linguaflow.local / demo-password-123)
#   docker compose --profile tools up  # also pgAdmin on http://localhost:5050
#   docker compose --profile observability up  # also Prometheus (:9090) and Grafana (:3001)
#   docker compose down                # stop; add -v to also delete the database
#
# The backend runs the dev profile, so it loads the demo data and serves the API docs at
# http://localhost:8080/swagger-ui.html. It reads backend/.env if present, e.g. for
# AI_API_KEY; that file stays on your machine and is never copied into an image.
# Host ports can be changed with FRONTEND_PORT, BACKEND_PORT, DB_PORT and PGADMIN_PORT.
# They listen on 127.0.0.1 only: the local passwords below are public, so nothing is
# reachable from other machines on your network.
name: linguaflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linguaflow
      POSTGRES_USER: linguaflow
      POSTGRES_PASSWORD: linguaflow
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguaflow -d linguaflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    # These win over backend/.env, so a DB_URL meant for running outside Docker is ignored
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/linguaflow
      DB_USERNAME: linguaflow
      DB_PASSWORD: linguaflow
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      # The browser sends an Origin header with every POST, so a changed FRONTEND_PORT must be allowed too
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      # Lets the observability profile's Prometheus scrape /actuator/prometheus (OPS-04); a
      # local value, not a secret. Deployed environments get a generated token.
      METRICS_TOKEN: local-metrics-token
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    # The images report their own health (OPS-01); start once the backend is ready
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"

  # Metrics and dashboards (OPS-04): docker compose --profile observability up
  # Prometheus on http://localhost:9090, Grafana on http://localhost:3001 (dashboards in
  # the LinguaFlow folder; anonymous viewers, admin/admin to edit locally)
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    depends_on:
      - backend
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/linguaflow-ai.json
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@linguaflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

volumes:
  db-data:
