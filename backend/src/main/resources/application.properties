spring.application.name=linguaflow

# Database (local defaults; INF-05 moves this to application.yml profiles with env-only secrets)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linguaflow}
spring.datasource.username=${DB_USERNAME:linguaflow}
spring.datasource.password=${DB_PASSWORD:linguaflow}

# Schema is owned by Flyway; Hibernate only validates the entity mapping against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
