# Local development. Values can be overridden by real environment variables or by a
# .env file in the working directory (see .env.example). The defaults below point at a
# local PostgreSQL and are NOT secrets.
spring:
  config:
    import: optional:file:.env[.properties]
  flyway:
    # Dev only: also load the demo data (db/dev/R__dev_seed.sql, DB-05)
    locations: classpath:db/migration,classpath:db/dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linguaflow}
    username: ${DB_USERNAME:linguaflow}
    password: ${DB_PASSWORD:linguaflow}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
  # Lists /actuator/health in the "all" group, so there is something to call before AUTH lands
  show-actuator: true

management:
  endpoint:
    health:
      show-details: always

linguaflow:
  security:
    jwt:
      # Dev-only signing key; prod requires JWT_SECRET from the environment
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
  cors:
    # Vite dev server and the docker compose frontend
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
