# Shared configuration for all profiles. Profile files override these values:
#   dev  - local development (default when no profile is set)
#   test - automated tests (datasource comes from Testcontainers)
#   prod - deployed environments; every secret MUST come from environment variables
spring:
  application:
    name: linguaflow
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates entity mappings against it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Vocabulary CSV import (VOC-07): 2000 rows fit comfortably
      max-file-size: 2MB
      max-request-size: 3MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  pattern:
    # Adds the request's correlation ID (CorrelationIdFilter) to every log line
    correlation: "[%X{correlationId:-}] "

# OpenAPI docs + Swagger UI: disabled by default, enabled in the dev profile only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json
  # Sorted keys keep the committed spec snapshot (frontend/openapi.json) diff-friendly
  writer-with-order-by-keys: true
  group-configs:
    # "all" is the full API (used for the generated frontend client, INF-09)
    - group: all
      paths-to-match: /api/**, /actuator/**
    - group: auth
      packages-to-scan: com.linguaflow.auth
    - group: user
      packages-to-scan: com.linguaflow.user
    - group: vocabulary
      packages-to-scan: com.linguaflow.vocabulary
    - group: grammar
      packages-to-scan: com.linguaflow.grammar
    - group: learning
      packages-to-scan: com.linguaflow.learning
    - group: flashcard
      packages-to-scan: com.linguaflow.flashcard
    - group: exercise
      packages-to-scan: com.linguaflow.exercise
    - group: progress
      packages-to-scan: com.linguaflow.progress
    - group: ai
      packages-to-scan: com.linguaflow.ai

server:
  # Behind nginx: take the client IP from X-Forwarded-For, but only when the request comes
  # from a private-network proxy (Tomcat's default internal-proxies), so clients cannot
  # spoof their IP to dodge rate limits.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

linguaflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
  ai:
    # LLM provider (AI-01). auto: Anthropic when AI_API_KEY is set, otherwise the offline fake client
    provider: ${AI_PROVIDER:auto}
    api-key: ${AI_API_KEY:}
    # Default model for every use case; override per use case under use-cases.<name>.{model,effort,max-tokens,timeout}
    model: ${AI_MODEL:claude-opus-5-5}
    # Background job queue (AI-04): jobs.{enabled,poll-interval,concurrency,batch-size,max-attempts,backoff-base,backoff-max,stale-after}
  # Answer checking (EX-03): exercises.evaluation.{umlaut-alternatives (default true), strict-case (default false)}
  cors:
    # Comma-separated origins allowed to call /api from the browser; empty = same-origin only
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
