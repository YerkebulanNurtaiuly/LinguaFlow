# Shared configuration for all profiles. Profile files override these values:
#   dev  - local development (default when no profile is set)
#   test - automated tests (datasource comes from Testcontainers)
#   prod - deployed environments; every secret MUST come from environment variables
spring:
  application:
    name: linguaflow
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates entity mappings against it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  pattern:
    # Adds the request's correlation ID (CorrelationIdFilter) to every log line
    correlation: "[%X{correlationId:-}] "

# OpenAPI docs + Swagger UI: disabled by default, enabled in the dev profile only
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  default-produces-media-type: application/json
  # Sorted keys keep the committed spec snapshot (frontend/openapi.json) diff-friendly
  writer-with-order-by-keys: true
  group-configs:
    # "all" is the full API (used for the generated frontend client, INF-09)
    - group: all
      paths-to-match: /api/**, /actuator/**
    - group: auth
      packages-to-scan: com.linguaflow.auth
    - group: user
      packages-to-scan: com.linguaflow.user
    - group: vocabulary
      packages-to-scan: com.linguaflow.vocabulary
    - group: grammar
      packages-to-scan: com.linguaflow.grammar
    - group: learning
      packages-to-scan: com.linguaflow.learning
    - group: flashcard
      packages-to-scan: com.linguaflow.flashcard
    - group: exercise
      packages-to-scan: com.linguaflow.exercise
    - group: progress
      packages-to-scan: com.linguaflow.progress
    - group: ai
      packages-to-scan: com.linguaflow.ai

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

linguaflow:
  security:
    jwt:
      secret: ${JWT_SECRET}
  ai:
    # Optional: without a key the app falls back to the fake LLM client (AI-01)
    api-key: ${AI_API_KEY:}
  cors:
    # Comma-separated origins allowed to call /api from the browser; empty = same-origin only
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
