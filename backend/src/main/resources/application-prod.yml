# Deployed environments. Required environment variables (startup fails without them):
#   the database: DB_URL, DB_USERNAME and DB_PASSWORD, or one libpq DATABASE_URL
#     (postgresql://user:password@host:port/db, as Render gives it; see
#     DatabaseUrlEnvironmentPostProcessor, OPS-02)
#   JWT_SECRET (at least 32 characters)
#   AI_API_KEY, unless AI_PROVIDER is scripted (staging, demos)
# Recommended: FRONTEND_URL, the public https URL (links in emails, and the default
#   allowed CORS origin). CORS_ALLOWED_ORIGINS overrides that list.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

linguaflow:
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # nginx forwards the browser's scheme and host, so same-origin calls pass anyway; this
  # keeps the public origin allowed if a proxy in between rewrites them
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:}}
  # No SMTP mailer yet: emails are suppressed (never logged with their secret links)
  mail:
    mode: disabled
  # Production needs the real AI client: startup fails without AI_API_KEY (AI-01)
  ai:
    provider: ${AI_PROVIDER:anthropic}
