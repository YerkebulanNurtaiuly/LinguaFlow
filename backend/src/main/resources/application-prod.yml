# Deployed environments. Required environment variables (startup fails without them):
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
# Optional: AI_API_KEY, CORS_ALLOWED_ORIGINS (only if the frontend is on another origin),
#   FRONTEND_URL (base of the links in emails)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

linguaflow:
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # No SMTP mailer yet: emails are suppressed (never logged with their secret links)
  mail:
    mode: disabled
  # Production needs the real AI client: startup fails without AI_API_KEY (AI-01)
  ai:
    provider: ${AI_PROVIDER:anthropic}
