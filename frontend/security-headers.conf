# Security headers for the app's pages and files (SEC-01). Included in each location that
# serves them (not the proxied /api/, which gets the backend's own headers). nginx drops
# inherited add_header directives in a location with its own, so the include is per location.
#
# Content-Security-Policy: everything comes from this origin. Scripts are files only
# (no inline scripts, no eval); the API is reached at /api on the same origin; images may
# also be data: URLs (SVG icons). React sets inline styles through the CSSOM, which
# style-src doesn't restrict. frame-ancestors forbids embedding (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS belongs to the HTTPS proxy in front of this container (OPS-02): sent over plain
# HTTP it's ignored, and on localhost it would pin the browser to HTTPS.
