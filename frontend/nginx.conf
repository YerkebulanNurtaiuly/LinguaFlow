# An nginx template (OPS-01): rendered at container start with BACKEND_URL and
# NGINX_LOCAL_RESOLVERS (docker/10-backend-url.envsh); nginx's own $variables stay as is.

# The scheme the browser used. Behind a TLS-terminating platform proxy (Render, a load
# balancer) that's the proxy's X-Forwarded-Proto; when nginx is reached directly, its own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The port the browser used: a platform proxy's X-Forwarded-Port, else the port in the Host
# header, else the scheme's default. Tomcat takes the port from X-Forwarded-Port (or falls
# back to 80/443), so without it a browser on localhost:3000 wouldn't count as same-origin.
map $http_host $host_port {
    ~:(?<port>[0-9]+)$ $port;
    default            "";
}
map "$http_x_forwarded_port|$host_port|$forwarded_proto" $forwarded_port {
    ~^(?<platform>[0-9]+)\|   $platform;
    ~^\|(?<inhost>[0-9]+)\|   $inhost;
    ~\|https$                 443;
    default                   80;
}

# HSTS only over HTTPS (OPS-02): on plain HTTP it's ignored, and on localhost it would pin
# developers' browsers to HTTPS. An empty value means the header isn't sent.
map $forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    # nginx-unprivileged listens on 8080: binding to ports below 1024 would need root
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-01: the security headers are included in each location that serves the app
    # (/, /assets/ and /healthz). Proxied locations get the backend's own headers instead,
    # so API responses don't carry two conflicting sets.
    # Don't announce the nginx version
    server_tokens off;

    # CSV import accepts files up to 2 MB (spring.servlet.multipart); leave room for the form
    client_max_body_size 3m;

    # The backend's address is resolved per request, not once at startup: a platform's
    # internal addresses change when the backend is redeployed (OPS-02)
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend "${BACKEND_URL}";

    # Cold-start tolerance. On a free Render instance the backend spins down after ~15 min
    # of inactivity and the next request has to boot it (Spring Boot + Flyway + JPA on a
    # throttled CPU, ~1-2 min). With nginx's 60s defaults that request times out as a hard
    # 502; these longer waits let it return a slow success instead. On a paid, always-warm
    # backend these never bite, since responses come back in well under a second.
    proxy_connect_timeout 75s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Backend API. BACKEND_TLS and BACKEND_PROXY_HOST come from docker/10-backend-url.envsh:
    # over an internal http upstream the Host is the browser's own ($http_host, same-origin);
    # over the backend's public https URL it's the backend's host (platform routing + SNI),
    # and the backend allows this origin through CORS. The backend still sees the browser's
    # scheme and port via the X-Forwarded-* headers.
    location /api/ {
        proxy_pass $backend;
        ${BACKEND_TLS}
        proxy_set_header Host ${BACKEND_PROXY_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # Only the health endpoints of the backend's actuator are reachable from outside
    location /actuator/health {
        proxy_pass $backend;
        ${BACKEND_TLS}
        proxy_set_header Host ${BACKEND_PROXY_HOST};
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # The container's own health check (OPS-01): nginx is serving
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the client-side router. index.html must
    # be revalidated, so a deploy's new asset names are picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
