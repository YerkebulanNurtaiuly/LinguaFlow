server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV import accepts files up to 2 MB (spring.servlet.multipart); leave room for the form
    client_max_body_size 3m;

    # Backend API and health, proxied inside the compose network
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the client-side router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
