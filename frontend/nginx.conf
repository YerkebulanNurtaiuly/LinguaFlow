server {
    # nginx-unprivileged listens on 8080: binding to ports below 1024 would need root
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEC-01: the security headers are included in each location that serves the app
    # (/, /assets/ and /healthz). Proxied locations get the backend's own headers instead,
    # so API responses don't carry two conflicting sets.
    # Don't announce the nginx version
    server_tokens off;

    # CSV import accepts files up to 2 MB (spring.servlet.multipart); leave room for the form
    client_max_body_size 3m;

    # Backend API. BACKEND_URL is filled in when the container starts (nginx templates,
    # OPS-01); it defaults to the compose service, http://backend:8080.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoints of the backend's actuator are reachable from outside
    location /actuator/health {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    # The container's own health check (OPS-01): nginx is serving
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by the client-side router. index.html must
    # be revalidated, so a deploy's new asset names are picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
