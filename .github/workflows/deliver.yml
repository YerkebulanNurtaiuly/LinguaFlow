name: Deliver

# OPS-03, continuous delivery. Once CI passes for a push to main:
#   1. build the backend and frontend images once, push them to GitHub's registry (GHCR)
#      tagged with the commit and "staging";
#   2. deploy exactly those images (by digest) to the Render staging environment;
#   3. check staging serves that commit and is healthy.
# Production gets the same images through the Promote workflow (promote.yml).
#
# Setup (docs/operations/deployment.md): repository secrets RENDER_DEPLOY_HOOK_STAGING_API,
# RENDER_DEPLOY_HOOK_STAGING_WEB and optionally RENDER_API_KEY; repository variable
# STAGING_URL. Without the hooks, images are still built and pushed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deliver-staging
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ github.event.workflow_run.head_sha }}
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image names
        id: names
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/linguaflow-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/linguaflow-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ steps.names.outputs.backend }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.names.outputs.backend }}:staging
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          build-args: APP_VERSION=${{ github.event.workflow_run.head_sha }}
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.names.outputs.frontend }}:staging
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          {
            echo "### Images for ${{ github.event.workflow_run.head_sha }}"
            echo "- \`${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}\`"
            echo "- \`${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING_API }}
      WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING_WEB }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.commit }}

      - name: Check the setup
        id: setup
        run: |
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ]; then
            echo "::notice::No Render deploy hooks for staging yet; images were pushed but not deployed"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The backend first: it migrates the database, and the new frontend may call new endpoints
      - name: Deploy the backend
        if: steps.setup.outputs.ready == 'true'
        run: scripts/render-deploy.sh "$API_HOOK" "${{ needs.images.outputs.backend }}"

      - name: Deploy the frontend
        if: steps.setup.outputs.ready == 'true'
        run: scripts/render-deploy.sh "$WEB_HOOK" "${{ needs.images.outputs.frontend }}"

      - name: Check staging
        if: steps.setup.outputs.ready == 'true' && vars.STAGING_URL != ''
        run: scripts/check-deployment.sh "${{ vars.STAGING_URL }}" "${{ needs.images.outputs.commit }}"
