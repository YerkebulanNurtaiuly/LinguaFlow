name: AI eval

# QA-03: a small eval set against the real model, to catch quality regressions from
# prompt, model or provider changes. It costs money, so it runs nightly and on demand,
# never on pushes. It needs the repository secret AI_API_KEY (Settings → Secrets and
# variables → Actions) and skips itself without it. The variable AI_MODEL may pick
# another model.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Live AI eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "No AI_API_KEY secret; skipping the live eval." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the eval
        if: steps.key.outputs.present == 'true'
        run: >
          ./mvnw -B -ntp test -Dai.live=true
          -Dtest='*EvalTests,AnthropicLiveTests'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Publish the scores
        if: always() && steps.key.outputs.present == 'true'
        run: cat target/ai-eval/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No eval report was written." >> "$GITHUB_STEP_SUMMARY"
