name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the Docker daemon that GitHub-hosted runners provide.
      # verify also runs the QA-06 gates: Checkstyle (validate) and JaCoCo's coverage check.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
            printf "### Backend coverage\n\nLines %.1f%%, branches %.1f%% (gate: services 80%% of lines; overall 90%% of lines, 80%% of branches)\n",
              100*lc/(lm+lc), 100*bc/(bm+bc) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # openapi.json itself is checked by the backend's OpenApiDocsTests
      - name: Check generated API types match openapi.json
        run: |
          npm run api:generate
          git diff --exit-code -- src/api/schema.ts || {
            echo "::error::src/api/schema.ts is stale. Run 'npm run api:generate' in frontend/ and commit it."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker stack (build, smoke & end-to-end tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # QA-05: scripted AI answers, so the end-to-end tests need no key
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7

      - name: Check the compose file
        run: docker compose config --quiet

      - name: Build the images
        run: docker compose build

      # INF-04's "done when": the stack starts and the frontend reaches the backend and database
      - name: Start the stack and check it end to end
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP through the frontend's nginx"
              curl -fsS -o /dev/null http://localhost:3000/
              exit 0
            fi
            sleep 3
          done
          echo "::error::The stack didn't come up"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # QA-05: register → onboard → bulk add → review → exercises → progress
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs backend | tail -200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
