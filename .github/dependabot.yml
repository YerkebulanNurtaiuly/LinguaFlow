# Dependency updates and security fixes (SEC-01). Dependabot opens pull requests, and
# CI checks each one like any other change. Security updates for known vulnerabilities
# also need "Dependabot security updates" turned on under Settings → Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ['org.springframework*', 'org.springdoc*']
      testing:
        patterns: ['org.testcontainers*', 'org.junit*', 'org.mockito*', 'org.assertj*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react*', 'react-router']
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom']

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: ['/backend', '/frontend']
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
