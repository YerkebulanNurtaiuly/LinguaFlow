# Render Blueprint for a free, single-environment deployment of LinguaFlow.
#
# This is the free-tier setup (one public environment, no managed database):
#   - linguaflow-api   the backend image as a PUBLIC web service on Render's free plan
#                      (free plans have no private services). One instance: the login rate
#                      limits and the AI job worker live in its memory.
#   - linguaflow-web   the frontend image as a public web service: nginx serves the app and
#                      proxies /api to the backend, so the browser stays same-origin.
#   - the database is external (Supabase/Neon free Postgres), reached through DATABASE_URL.
#
# Create it in the Render Dashboard: New → Blueprint → this repository. The full walkthrough,
# the Supabase connection string and the free-tier caveats are in
# docs/operations/deployment.md.
#
# The services run images built once by GitHub Actions and pushed to GHCR (OPS-03): the
# Deliver workflow deploys each green commit on main. Pulling them needs the Render registry
# credential "ghcr-linguaflow" (a GitHub token with read:packages).
#
# Free-tier facts to expect:
#   - a service spins down after ~15 min idle; the next request wakes it (the backend takes
#     1-2 min to boot and migrate), so the AI job worker is idle while the app sleeps;
#   - 512 MB memory for the Java backend is tight (see JAVA_TOOL_OPTIONS below);
#   - Supabase free pauses a project after a week of inactivity; resume it in its dashboard.
#
# There is deliberately no private networking block: the backend must reach the external
# database and the Anthropic API, so its outbound traffic is not isolated.

previews:
  generation: off

projects:
  - name: linguaflow
    environments:
      - name: production
        services:
          - type: web
            name: linguaflow-api
            runtime: image
            image:
              url: ghcr.io/yerkebulannurtaiuly/linguaflow-backend:production
              creds:
                fromRegistryCreds:
                  name: ghcr-linguaflow
            region: frankfurt
            plan: free
            healthCheckPath: /actuator/health
            envVars:
              - key: SPRING_PROFILES_ACTIVE
                value: prod
              # Bind the port the Docker HEALTHCHECK and nginx expect
              - key: PORT
                value: "8080"
              # The external Postgres (Supabase session pooler / Neon), as a libpq URL
              # postgresql://user:pass@host:port/db. DatabaseUrlEnvironmentPostProcessor
              # turns it into the JDBC settings. Entered in the Dashboard, never in this file.
              - key: DATABASE_URL
                sync: false
              - key: JWT_SECRET
                generateValue: true
              # The Anthropic API key; entered in the Dashboard, never in this file
              - key: AI_API_KEY
                sync: false
              # The Claude model every AI use case runs on (overridable per use case). Opus 4.8;
              # its price is built into AiPricing, so cost logging stays accurate.
              - key: AI_MODEL
                value: claude-opus-4-8
              # The public URL of linguaflow-web, e.g. https://linguaflow-web.onrender.com.
              # Used for email links and as the allowed CORS origin.
              - key: FRONTEND_URL
                sync: false
              # Free-tier JVM tuning for a 512 MB instance: an explicit max heap (overrides the
              # image's MaxRAMPercentage), the serial GC and capped non-heap areas to fit the
              # footprint. Raise these on a larger plan.
              - key: JAVA_TOOL_OPTIONS
                value: "-Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k"
              # Observability (OPS-04): Sentry when a DSN is entered (empty = off), a generated
              # token for a metrics scraper
              - key: SENTRY_DSN
                sync: false
              - key: SENTRY_ENVIRONMENT
                value: production
              - key: METRICS_TOKEN
                generateValue: true

          - type: web
            name: linguaflow-web
            runtime: image
            image:
              url: ghcr.io/yerkebulannurtaiuly/linguaflow-frontend:production
              creds:
                fromRegistryCreds:
                  name: ghcr-linguaflow
            region: frankfurt
            plan: free
            healthCheckPath: /healthz
            envVars:
              - key: PORT
                value: "8080"
              # The backend's address. fromService gives its internal host:port over Render's
              # private network; if a free instance can't be reached that way, override this in
              # the Dashboard with the backend's public URL (https://linguaflow-api.onrender.com).
              - key: BACKEND_URL
                fromService:
                  type: web
                  name: linguaflow-api
                  property: hostport
